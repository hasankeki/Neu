name: Android Debug Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Add version and Berlin timestamp to APK filename
        id: apk_name
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          BUILD_TIMESTAMP=$(TZ=Europe/Berlin date +'%Y-%m-%d_%H-%M-%S')
          APK_NAME="NurWallpaper-v${VERSION_NAME}-${BUILD_TIMESTAMP}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK_NAME}"
          echo "file=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload timestamped debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NurWallpaper-${{ steps.apk_name.outputs.file }}
          path: app/build/outputs/apk/debug/${{ steps.apk_name.outputs.file }}
          if-no-files-found: error

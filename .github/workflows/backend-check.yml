name: Backend checks

on:
  push:
    branches:
      - feature/free-foundation-golden-flow
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: node --check server.mjs
      - name: Run tests
        run: npm test
